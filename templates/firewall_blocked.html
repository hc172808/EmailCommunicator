{% extends "base.html" %}
{% block title %}Access Blocked{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5 text-center">
    <div class="card">
      <div class="card-body py-5">
        <i data-feather="shield-off" style="width:64px;height:64px;" class="text-danger mb-3 d-block mx-auto"></i>
        <h2 class="mb-2">Access Blocked</h2>
        <p class="text-muted mb-1">Your IP address has been blocked by the server firewall.</p>
        <code class="text-muted small">{{ ip }}</code>
        <div class="mt-4">
          <p class="text-muted small">If you believe this is a mistake, please contact the administrator.</p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
