<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline – Netlifegy Mail</title>
  <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #0d1117; }
    .icon-wrap { width: 96px; height: 96px; border-radius: 24px; background: rgba(99,102,241,.15); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; }
    svg.hero { width: 48px; height: 48px; stroke: #6366f1; }
  </style>
</head>
<body>
  <div class="text-center px-3">
    <div class="icon-wrap">
      <svg class="hero" viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>
    <h1 class="h3 fw-bold text-white mb-2">You're offline</h1>
    <p class="text-muted mb-4">No internet connection right now.<br>Check your network and try again.</p>
    <button class="btn btn-primary px-4" onclick="window.location.reload()">
      Try again
    </button>
  </div>
</body>
</html>
