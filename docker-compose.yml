services:
  app:
    image: netlifegy-app
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://netlifegy:${DB_PASSWORD}@db:5432/netlifegy
      SESSION_SECRET: ${SESSION_SECRET}
    volumes:
      - profile_pics:/app/static/profile_pics
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: netlifegy
      POSTGRES_USER: netlifegy
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netlifegy"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  profile_pics:
